spring.application.name=worker

health.check.timeout.ms=${HEALTH_CHECK_TIMEOUT_MS:5000}
health.check.interval.ms=${HEALTH_CHECK_INTERVAL_MS:30000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitoring_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false